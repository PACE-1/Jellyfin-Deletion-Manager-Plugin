name: Release

# Push a tag such as v1.1.0.0. The version in the tag must match <AssemblyVersion> in DeletionManager.csproj.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag against the project version
        run: |
          version=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.DeletionManager/DeletionManager.csproj)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - name: Backend and browser tests
        run: |
          dotnet test tests/Jellyfin.Plugin.DeletionManager.Tests --configuration Release
          npm ci --prefix tests/javascript --ignore-scripts
          npm test --prefix tests/javascript

      - name: Publication privacy and catalog checks
        run: |
          python3 -m unittest discover -s tests/scripts -v
          python3 scripts/audit-publication.py .

      - name: Package
        run: |
          python3 scripts/package-deletion-manager.py --no-docker --repo "$GITHUB_REPOSITORY" --merge-into manifest.json
          python3 scripts/audit-publication.py dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/manifest.json \
            --title "Jellyfin Deletion Manager $GITHUB_REF_NAME" --generate-notes

      - name: Propose the catalog update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/manifest.json /tmp/release-manifest.json
          git fetch origin main
          git checkout -B "catalog/$GITHUB_REF_NAME" origin/main
          python3 scripts/merge-catalog.py manifest.json /tmp/release-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Catalog: add $GITHUB_REF_NAME"
          git push origin "catalog/$GITHUB_REF_NAME"
          printf 'Adds the verified catalog entry for %s. Merge after the required checks pass.\n' "$GITHUB_REF_NAME" > /tmp/catalog-pr.md
          if gh pr create --base main --head "catalog/$GITHUB_REF_NAME" \
              --title "Catalog: add $GITHUB_REF_NAME" --body-file /tmp/catalog-pr.md; then
            # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
            # Dispatch the required checks explicitly on the catalog branch.
            gh workflow run tests.yml --ref "catalog/$GITHUB_REF_NAME"
          else
            echo "::warning::Could not open the catalog pull request (enable Settings, Actions, General, Allow GitHub Actions to create pull requests). The release is published and its catalog is available at releases/latest/download/manifest.json."
          fi
