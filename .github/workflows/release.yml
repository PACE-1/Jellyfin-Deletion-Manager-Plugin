name: Release

# Push a tag such as v1.1.0.0. The version in the tag must match <AssemblyVersion> in DeletionManager.csproj.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag against the project version
        run: |
          version=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.DeletionManager/DeletionManager.csproj)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - name: Backend and browser tests
        run: |
          dotnet test tests/Jellyfin.Plugin.DeletionManager.Tests --configuration Release
          npm ci --prefix tests/javascript --ignore-scripts
          npm test --prefix tests/javascript

      - name: Package
        run: python3 scripts/package-deletion-manager.py --no-docker --repo "$GITHUB_REPOSITORY" --merge-into manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/manifest.json \
            --title "Jellyfin Deletion Manager $GITHUB_REF_NAME" --generate-notes

      - name: List the new version in the catalog
        # The catalog URL points at manifest.json on main. If main is protected, open a pull request with
        # dist/manifest.json from the release assets instead (see docs/RELEASING.md).
        run: |
          cp dist/manifest.json /tmp/manifest.json
          git fetch origin main
          git checkout -f main
          cp /tmp/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Catalog: add $GITHUB_REF_NAME" || exit 0
          git push origin main
