name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Backend tests
        run: dotnet test tests/Jellyfin.Plugin.DeletionManager.Tests --configuration Release

      - name: Build the plugin
        run: dotnet build Jellyfin.Plugin.DeletionManager/DeletionManager.csproj --configuration Release

      - name: Browser UI tests
        run: |
          npm ci --prefix tests/javascript --ignore-scripts
          npm test --prefix tests/javascript

  smoke:
    # Clean Jellyfin container, generated media, headless browser. Deletes generated files only.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Build the plugin
        run: dotnet build Jellyfin.Plugin.DeletionManager/DeletionManager.csproj --configuration Release

      - name: Smoke test
        run: python3 tests/smoke/smoke.py --dll Jellyfin.Plugin.DeletionManager/bin/Release/net10.0/Jellyfin.Plugin.DeletionManager.dll
