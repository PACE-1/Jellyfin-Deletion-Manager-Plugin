name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: plugin
    attributes: { label: Plugin version, placeholder: "1.1.0.0" }
    validations: { required: true }
  - type: input
    id: jellyfin
    attributes: { label: Jellyfin version and install type, placeholder: "12.1.0, official Docker image" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: textarea
    id: logs
    attributes: { label: Relevant server log lines, render: text }
