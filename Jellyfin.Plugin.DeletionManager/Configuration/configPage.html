<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellyfin Deletion Manager</title>
</head>
<body>
<div id="DeletionManagerConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <h2>Jellyfin Deletion Manager</h2>
            <form id="DeletionManagerConfigForm">
                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="DeletionExecutionEnabled" />
                    <span>Enable physical deletion. Leave off until you have reviewed the request queue.</span>
                </label>
                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="DeletionFavoriteProtectionEnabled" />
                    <span>Ask an admin before deleting items that any user has favorited.</span>
                </label>
                <p>Optional. Before deleting, unmonitor the media in Sonarr/Radarr so it is not downloaded again. The series or movie stays in Sonarr/Radarr. Leave blank to skip.</p>
                <div class="inputContainer">
                    <input is="emby-input" type="url" id="SonarrUrl" label="Sonarr URL (e.g. http://sonarr:8989)" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="password" id="SonarrApiKey" label="Sonarr API key" autocomplete="off" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="url" id="RadarrUrl" label="Radarr URL (e.g. http://radarr:7878)" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="password" id="RadarrApiKey" label="Radarr API key" autocomplete="off" />
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = 'f501435c-5b9d-4f2c-9556-12297eee46e7';
            var page = document.querySelector('#DeletionManagerConfigPage');
            var fields = ['DeletionExecutionEnabled', 'DeletionFavoriteProtectionEnabled'];
            var textFields = ['SonarrUrl', 'SonarrApiKey', 'RadarrUrl', 'RadarrApiKey'];
            page.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    fields.forEach(function (name) { page.querySelector('#' + name).checked = !!config[name]; });
                    textFields.forEach(function (name) { page.querySelector('#' + name).value = config[name] || ''; });
                    Dashboard.hideLoadingMsg();
                });
            });
            page.querySelector('#DeletionManagerConfigForm').addEventListener('submit', function (event) {
                event.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    fields.forEach(function (name) { config[name] = page.querySelector('#' + name).checked; });
                    textFields.forEach(function (name) { config[name] = page.querySelector('#' + name).value.trim(); });
                    ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
                });
            });
        })();
    </script>
</div>
</body>
</html>
